<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b1a">
<title>준우 · 정우 생일 서프라이즈</title>
<style>
  :root { --bg:#0b0b1a; --fg:#fff; --accent:#ffd54a; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family:-apple-system,"Noto Sans KR","Malgun Gothic",system-ui,sans-serif; }
  #ar { position:fixed; inset:0; }
  #ar video, #ar canvas { position:absolute !important; }

  .screen { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; padding:24px; text-align:center;
    background:radial-gradient(circle at 50% 30%, #2a1f5c 0%, #0b0b1a 70%); }
  .screen.hidden { display:none; }
  h1 { margin:0; font-size:clamp(26px,7vw,40px); line-height:1.3; }
  h1 span { color:var(--accent); }
  p { margin:0; font-size:clamp(15px,4vw,19px); line-height:1.6; opacity:.9; }
  button { font:inherit; cursor:pointer; border:0; border-radius:999px; padding:14px 34px; font-size:20px; font-weight:800;
    color:#2b1a00; background:linear-gradient(180deg,#ffe27a,#ffb703); box-shadow:0 6px 0 #b27a00, 0 12px 24px rgba(0,0,0,.4); }
  button:active { transform:translateY(3px); box-shadow:0 3px 0 #b27a00; }
  .gift-emoji { font-size:72px; animation:bob 1.6s ease-in-out infinite; }
  @keyframes bob { 50% { transform:translateY(-10px) rotate(4deg); } }
  #err { color:#ff9c9c; font-size:15px; max-width:420px; white-space:pre-line; }

  /* 스캔 안내 */
  #scan { position:fixed; left:0; right:0; bottom:calc(28px + env(safe-area-inset-bottom)); z-index:10; text-align:center;
    pointer-events:none; transition:opacity .4s; }
  #scan.hidden { opacity:0; }
  #scan div { display:inline-block; padding:10px 18px; border-radius:999px; background:rgba(0,0,0,.55); font-size:16px; }
  #frame { position:fixed; inset:0; z-index:5; pointer-events:none; display:flex; align-items:center; justify-content:center; transition:opacity .4s; }
  #frame.hidden { opacity:0; }
  #frame i { width:min(78vw,60vh); aspect-ratio:1; border:3px dashed rgba(255,255,255,.7); border-radius:22px; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { transform:scale(1.04); border-color:#ffd54a; } }

  /* 축하 메시지 */
  #msg { position:fixed; left:0; right:0; top:calc(8vh + env(safe-area-inset-top)); z-index:10; text-align:center; pointer-events:none; padding:0 16px; }
  #msg .line { opacity:0; transform:scale(.4); margin:6px 0; font-weight:900; color:#fff;
    text-shadow:0 0 12px var(--c,#ffd54a), 0 3px 0 rgba(0,0,0,.55), 0 0 28px rgba(0,0,0,.6);
    animation:pop .7s cubic-bezier(.2,1.6,.4,1) forwards; }
  #msg .line.big { font-size:clamp(34px,10vw,58px); }
  #msg .line.small { font-size:clamp(20px,5.6vw,30px); }
  #msg .line.now { animation:none; opacity:1; transform:none; }
  @keyframes pop { to { opacity:1; transform:scale(1); } }

  #letterBtn { position:fixed; left:50%; bottom:calc(28px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:12; display:none; white-space:nowrap; }
  #letterBtn.show { display:block; animation:rise .6s ease-out; }
  @keyframes rise { from { opacity:0; transform:translate(-50%,30px); } }
  #view360 { position:fixed; left:14px; top:calc(12px + env(safe-area-inset-top)); z-index:12; padding:8px 14px; font-size:14px; display:none; box-shadow:0 3px 0 #b27a00; }
  #view360.show { display:block; }
  #viewer { position:fixed; inset:0; z-index:25; display:none; background:radial-gradient(circle at 50% 40%, #33295f 0%, #0b0b1a 75%); }
  #viewer.show { display:block; }
  #viewerCanvas { position:absolute; inset:0; }
  #viewer .vtop { position:absolute; left:0; right:0; top:calc(12px + env(safe-area-inset-top)); display:flex; align-items:center; justify-content:space-between; padding:0 14px; pointer-events:none; }
  #viewer .vtop b { font-size:22px; text-shadow:0 2px 8px rgba(0,0,0,.6); }
  #viewer .vtop button { pointer-events:auto; padding:8px 16px; font-size:15px; box-shadow:0 3px 0 #b27a00; }
  #viewer .vhint { position:absolute; left:0; right:0; bottom:calc(26px + env(safe-area-inset-bottom)); text-align:center; font-size:15px; opacity:.85; pointer-events:none; }
  #magic { position:fixed; left:0; right:0; bottom:calc(96px + env(safe-area-inset-bottom)); z-index:11; display:none; text-align:center; }
  #magic.show { display:block; animation:rise .6s ease-out; }
  #magic p { font-size:14px; margin-bottom:8px; text-shadow:0 1px 4px #000; }
  #magic button { font-size:16px; padding:10px 18px; margin:0 4px; }
  #scan small { display:block; margin-top:4px; font-size:13px; opacity:.85; }
  #again { position:fixed; right:14px; top:calc(12px + env(safe-area-inset-top)); z-index:12; padding:8px 14px; font-size:14px; display:none; box-shadow:0 3px 0 #b27a00; }
  #again.show { display:block; }

  /* 편지 */
  #letter { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center; padding:20px; background:rgba(0,0,0,.65); }
  #letter.show { display:flex; }
  #paper { width:min(92vw,480px); max-height:86vh; overflow:auto; padding:26px 24px; border-radius:18px; color:#4a3320;
    background:linear-gradient(#fff8e6,#ffefc2); box-shadow:0 20px 60px rgba(0,0,0,.6); animation:rise2 .5s ease-out; }
  @keyframes rise2 { from { opacity:0; transform:translateY(40px) scale(.95); } }
  #paper h2 { margin:0 0 12px; font-size:24px; }
  #paper .body { white-space:pre-wrap; line-height:1.85; font-size:17px; }
  #paper .hint { margin-top:18px; padding:12px 14px; border-radius:12px; background:#fff; border:2px dashed #e0a000; font-weight:700; line-height:1.6; }
  #paper button { margin-top:18px; font-size:17px; padding:10px 26px; }

  #flash { position:fixed; inset:0; z-index:9; background:#fff; opacity:0; pointer-events:none; }
</style>
</head>
<body>
<div id="ar"></div>
<div id="flash"></div>
<div id="frame" class="hidden"><i></i></div>
<div id="scan" class="hidden"><div>📷 선물 그림을 화면에 비춰 보세요<small>어두운 바탕 위에 두면 더 잘 보여요</small></div></div>
<div id="msg"></div>
<div id="magic"><p>잘 안 보이나요? 🪄 마법으로 꺼내기</p><button data-kid="0">준우 선물</button><button data-kid="1">정우 선물</button></div>
<button id="again">🔁 다시 보기</button>
<button id="view360">🔄 360° 보기</button>
<button id="letterBtn">💌 편지 열기</button>

<div id="viewer">
  <div id="viewerCanvas"></div>
  <div class="vtop"><b id="viewerTitle"></b><button id="viewerClose">닫기 ✕</button></div>
  <div class="vhint">👆 손가락으로 돌려 보세요 · 두 손가락으로 크게/작게</div>
</div>

<div id="letter"><div id="paper"></div></div>

<div id="start" class="screen">
  <div class="gift-emoji">🎁</div>
  <h1><span>준우</span> · <span>정우</span><br>생일 서프라이즈</h1>
  <p>카메라로 <b>선물 그림</b>을 비추면<br>무슨 일이 일어날지도 몰라요…!</p>
  <button id="startBtn">시작하기</button>
  <p id="err"></p>
</div>

<script type="importmap">
{ "imports": { "three": "./lib/three.module.js", "three/addons/": "./lib/addons/" } }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
