<!doctype html><meta charset="utf-8"><body>
<script type="module">
import { Compiler } from "../lib/mindar-image.prod.js";
window.compileTargets = async (urls) => {
  const imgs = await Promise.all(urls.map(u => new Promise((res, rej) => {
    const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = u;
  })));
  const c = new Compiler();
  await c.compileImageTargets(imgs, p => { window.__p = p; });
  const buf = await c.exportData();
  let s = ""; const a = new Uint8Array(buf);
  for (let i = 0; i < a.length; i += 8192) s += String.fromCharCode.apply(null, a.subarray(i, i + 8192));
  return btoa(s);
};
window.ready = true;
</script>
